[package]
name = "margins"
version = "0.4.8"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = [
    ".",
    "crates/public/margins-core",
    "crates/public/margins-media",
    "crates/public/margins-cli",
    "crates/public/margins-store",
    "crates/public/margins-workflows",
    "crates/public/margins-meeting-protocol",
    "crates/public/margins-meeting-runtime",
    "crates/private/recall-engine",
]
default-members = [
    ".",
    "crates/public/margins-core",
    "crates/public/margins-media",
    "crates/public/margins-cli",
    "crates/public/margins-store",
    "crates/public/margins-workflows",
    "crates/public/margins-meeting-protocol",
    "crates/public/margins-meeting-runtime",
]
exclude = ["desktop/src-tauri"]
resolver = "2"
[workspace.dependencies]
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }


[lib]
name = "margins"
path = "src/lib.rs"

[[bin]]
# Internal target name avoids colliding with the public CLI's `margins` target.
# Release packaging and the desktop sidecar stage this as user-facing `margins`.
name = "margins-private"
path = "src/main.rs"

[features]
default = ["coreml-asr", "audio-capture", "polyvoice-coreml", "recall-local-model"]
audio-capture = ["dep:cpal", "dep:cidre"]
# Associative vault search backing `margins recall`. Composes the subtree-linked
# private recall engine's portable orchestration and lookup into the binary. The
# public CLI keeps the command present and degrades gracefully when this port is
# absent.
recall = ["dep:recall-engine", "dep:reqwest", "dep:tokio"]
# In-process llama.cpp generation for offline thematic bridges. Kept separate
# so recall policy and lookup tests need no native C/C++ inference toolchain.
recall-local-model = ["recall", "recall-engine/local-llm"]
parakeet-asr = ["margins-cli/parakeet-onnx", "margins-media/parakeet-onnx"]
parakeet-asr-dynamic = ["parakeet-asr", "margins-media/parakeet-onnx-dynamic"]
coreml-asr = ["margins-cli/coreml-asr", "margins-media/coreml-asr"]
polyvoice-diarization = [
    "margins-cli/polyvoice-diarization",
    "margins-media/polyvoice-diarization",
]
polyvoice-coreml = ["polyvoice-diarization", "margins-media/polyvoice-coreml"]

[dependencies]
anyhow = "1"
margins-core = { path = "crates/public/margins-core" }
margins-media = { path = "crates/public/margins-media" }
margins-cli = { path = "crates/public/margins-cli" }
margins-store = { path = "crates/public/margins-store" }
margins-workflows = { path = "crates/public/margins-workflows" }
margins-meeting-protocol = { path = "crates/public/margins-meeting-protocol" }
rusqlite.workspace = true
recall-engine = { path = "crates/private/recall-engine", package = "enzyme-core", features = ["embedder-compat"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.15", optional = true }
crossterm = "0.28"
dasp = "0.11"
hound = "3.5"
dirs = "6"
include_dir = "0.7"
rtrb = "0.3"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
margins-workflows = { path = "crates/public/margins-workflows", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.14", features = ["av"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
