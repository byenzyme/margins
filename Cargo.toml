[package]
name = "margins"
version = "0.4.15"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = [
    ".",
    "crates/public/margins-core",
    "crates/public/margins-media",
    "crates/public/margins-capture",
    "crates/public/margins-cli",
    "crates/public/margins-store",
    "crates/public/margins-workflows",
    "crates/public/margins-meeting-protocol",
    "crates/public/margins-meeting-runtime",
    "crates/public/margins-server",
]
default-members = [
    ".",
    "crates/public/margins-core",
    "crates/public/margins-media",
    "crates/public/margins-capture",
    "crates/public/margins-cli",
    "crates/public/margins-store",
    "crates/public/margins-workflows",
    "crates/public/margins-meeting-protocol",
    "crates/public/margins-meeting-runtime",
    "crates/public/margins-server",
]
exclude = ["desktop/src-tauri", "crates/public/margins-server/vendor/matroska-demuxer"]
resolver = "2"
[workspace.dependencies]
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }


[lib]
name = "margins"
path = "src/lib.rs"

[[bin]]
# Internal target name avoids colliding with the public CLI's `margins` target.
# Release packaging and the desktop sidecar stage this as user-facing `margins`.
name = "margins-private"
path = "src/main.rs"

[features]
default = ["coreml-asr", "audio-capture", "polyvoice-coreml", "recall-local-model"]
audio-capture = ["margins-capture/audio-capture"]
# The public manifest and lockfile contain no private git source. Official
# builds use scripts/with-private-recall to inject the pinned optional engine.
recall = ["dep:reqwest", "dep:tokio"]
# In-process llama.cpp generation for offline thematic bridges. Kept separate
# so recall policy and lookup tests need no native C/C++ inference toolchain.
recall-local-model = ["recall"]
parakeet-asr = ["margins-cli/parakeet-onnx", "margins-media/parakeet-onnx", "margins-media/model-download", "margins-capture/parakeet-asr"]
parakeet-asr-dynamic = ["parakeet-asr", "margins-media/parakeet-onnx-dynamic"]
coreml-asr = ["margins-cli/coreml-asr", "margins-media/coreml-asr", "margins-media/model-download", "margins-capture/coreml-asr"]
polyvoice-diarization = [
    "margins-cli/polyvoice-diarization",
    "margins-media/polyvoice-diarization",
    "margins-capture/polyvoice-diarization",
]
polyvoice-coreml = ["polyvoice-diarization", "margins-media/polyvoice-coreml", "margins-capture/polyvoice-coreml"]

[dependencies]
anyhow = "1"
margins-core = { path = "crates/public/margins-core" }
margins-media = { path = "crates/public/margins-media" }
margins-capture = { path = "crates/public/margins-capture" }
margins-cli = { path = "crates/public/margins-cli" }
margins-store = { path = "crates/public/margins-store" }
margins-workflows = { path = "crates/public/margins-workflows" }
margins-meeting-protocol = { path = "crates/public/margins-meeting-protocol" }
margins-meeting-runtime = { path = "crates/public/margins-meeting-runtime" }
rusqlite.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ctor = "0.2.9"
hound = "3.5"
margins-workflows = { path = "crates/public/margins-workflows", features = ["test-support"] }
margins-meeting-runtime = { path = "crates/public/margins-meeting-runtime", features = ["test-support"] }
