name: CI

on:
  workflow_dispatch:

jobs:
  fresh-onboarding-harness:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build portable private Margins CLI
        run: cargo build --package margins --bin margins-private --no-default-features --features recall

      - name: Exercise isolated native Google onboarding
        run: tests/test_e2e_fresh_onboarding.sh
        env:
          MARGINS_E2E_BIN: ${{ github.workspace }}/target/debug/margins-private

      - name: Exercise setup E2E lane shell contracts
        run: tests/test_setup_e2e_lanes.sh

      - name: Exercise ecological setup rollout capture hard gates
        run: tests/test_workspace_setup_rollout_review.sh

      - name: Test portable workspace
        run: cargo test --workspace --no-default-features --features recall

  # Emergency dispatch can still exercise the former macOS CI composition.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2

      - name: Build private distributable
        run: cargo build --release --package margins --bin margins-private

      - name: Build public workspace
        run: cargo build --workspace --exclude margins --all-targets

      - name: Test private composition
        run: cargo test --package margins

      - name: Test public workspace
        run: cargo test --workspace --exclude margins --all-targets
