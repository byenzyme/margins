name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true
        type: string

# This workflow only bumps versions and pushes the release commit to main. The
# "release tags v*" ruleset lets only repository admins create v* tags, so it
# never tags or dispatches cli-release; it prints the tag commands instead.
jobs:
  bump:
    runs-on: ubuntu-latest
    # ENZYME_RUST_DEPLOY_KEY is an environment secret on official-cli-release.
    environment: official-cli-release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate semver
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi

      - name: Bump CLI versions
        run: |
          perl -0pi -e 's/^(name = "margins"\nversion = ")[^"]+/${1}'"$VERSION"'/m' Cargo.toml
          perl -0pi -e 's/^(name = "margins-cli"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-cli/Cargo.toml
          perl -0pi -e 's/^(name = "margins-server"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-server/Cargo.toml
          perl -0pi -e 's/(margins-cli = \{ version = ")[^"]+/${1}'"$VERSION"'/' crates/public/margins-capture/Cargo.toml
          scripts/cargo-lane shared -- cargo update -p margins -p margins-cli -p margins-server

      - name: Authenticate private recall source
        uses: ./.github/actions/private-recall-ssh
        with:
          mode: setup
          deploy-key: ${{ secrets.ENZYME_RUST_DEPLOY_KEY }}

      - name: Refresh private recall composition lockfile
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          scripts/with-private-recall bash -c '
             scripts/cargo-lane shared -- cargo update -p margins -p margins-cli -p margins-server
             cp Cargo.lock Cargo.private-recall.lock
           '

      - name: Remove private recall credentials
        if: always()
        uses: ./.github/actions/private-recall-ssh
        with:
          mode: cleanup

      - name: Commit and push release commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock Cargo.private-recall.lock \
            crates/public/margins-cli/Cargo.toml crates/public/margins-server/Cargo.toml \
            crates/public/margins-capture/Cargo.toml
          git commit -m "Release v${VERSION}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Print tag commands for a repository admin
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG_COMMANDS="git tag -a v${VERSION} ${SHA} -m \"Margins ${VERSION}\" && git push origin v${VERSION}"
          echo "::notice title=Tag v${VERSION}::${TAG_COMMANDS}"
          {
            echo "### Release commit pushed to main"
            echo
            echo "Commit: \`${SHA}\`"
            echo
            echo "Only a repository admin can create the release tag. After \`git fetch origin main\`, run the command below; pushing the tag starts cli-release.yml:"
            echo
            echo '```bash'
            echo "${TAG_COMMANDS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
