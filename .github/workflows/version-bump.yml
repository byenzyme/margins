name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate semver
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: ${{ inputs.version }}"
            exit 1
          fi

      - name: Bump CLI versions
        run: |
          export VERSION="${{ inputs.version }}"
          perl -0pi -e 's/^(name = "margins"\nversion = ")[^"]+/${1}'"$VERSION"'/m' Cargo.toml
          perl -0pi -e 's/^(name = "margins-cli"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-cli/Cargo.toml
          perl -0pi -e 's/^(name = "margins-server"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-server/Cargo.toml
          scripts/cargo-lane shared -- cargo update -p margins -p margins-cli -p margins-server
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("public-repository/Cargo.lock")
          text = path.read_text()
          for name in ("margins-cli", "margins-server"):
              pattern = rf'(\[\[package\]\]\nname = "{name}"\nversion = ")[^"]+("\n)'
              text, count = re.subn(
                  pattern,
                  rf'\g<1>{os.environ["VERSION"]}\g<2>',
                  text,
              )
              if count != 1:
                  raise SystemExit(f"expected one {name} lock package, found {count}")
          path.write_text(text)
          PY

      - name: Commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/public/margins-cli/Cargo.toml \
            crates/public/margins-server/Cargo.toml public-repository/Cargo.lock
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Dispatch CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run cli-release.yml --ref main -f tag="v${VERSION}"
