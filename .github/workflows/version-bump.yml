name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true
        type: string
      desktop:
        description: "Also build and publish the macOS desktop app"
        required: false
        default: false
        type: boolean

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate semver
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: ${{ inputs.version }}"
            exit 1
          fi

      - name: Bump CLI versions
        run: |
          export VERSION="${{ inputs.version }}"
          perl -0pi -e 's/^(name = "margins"\nversion = ")[^"]+/${1}'"$VERSION"'/m' Cargo.toml
          perl -0pi -e 's/^(name = "margins-cli"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-cli/Cargo.toml
          cargo update -p margins -p margins-cli
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("public-repository/Cargo.lock")
          text = path.read_text()
          pattern = r'(\[\[package\]\]\nname = "margins-cli"\nversion = ")[^"]+("\n)'
          updated, count = re.subn(
              pattern,
              rf'\g<1>{os.environ["VERSION"]}\g<2>',
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one margins-cli lock package, found {count}")
          path.write_text(updated)
          PY

      - name: Bump desktop versions
        run: |
          export VERSION="${{ inputs.version }}"
          cd desktop
          npm version "$VERSION" --no-git-tag-version
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '
          perl -0pi -e 's/^version = ".*"/version = "'$VERSION'"/m' src-tauri/Cargo.toml
          cd src-tauri
          cargo update -p margins-desktop

      - name: Commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/public/margins-cli/Cargo.toml \
            public-repository/Cargo.lock \
            desktop/package.json desktop/package-lock.json \
            desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock \
            desktop/src-tauri/tauri.conf.json
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Dispatch CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run cli-release.yml --ref main -f tag="v${VERSION}"

      - name: Dispatch desktop release
        if: ${{ inputs.desktop }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run release.yml --ref main -f tag="v${VERSION}"
