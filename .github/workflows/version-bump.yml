name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate semver
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: ${{ inputs.version }}"
            exit 1
          fi

      - name: Bump CLI versions
        run: |
          export VERSION="${{ inputs.version }}"
          perl -0pi -e 's/^(name = "margins"\nversion = ")[^"]+/${1}'"$VERSION"'/m' Cargo.toml
          perl -0pi -e 's/^(name = "margins-cli"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-cli/Cargo.toml
          perl -0pi -e 's/^(name = "margins-server"\nversion = ")[^"]+/${1}'"$VERSION"'/m' crates/public/margins-server/Cargo.toml
          perl -0pi -e 's/(margins-cli = \{ version = ")[^"]+/${1}'"$VERSION"'/' crates/public/margins-capture/Cargo.toml
          scripts/cargo-lane shared -- cargo update -p margins -p margins-cli -p margins-server

      - name: Refresh private recall composition lockfile
        env:
          GH_TOKEN: ${{ secrets.ENZYME_RUST_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          scripts/with-private-recall bash -c '
             scripts/cargo-lane shared -- cargo update -p margins -p margins-cli -p margins-server
             cp Cargo.lock Cargo.private-recall.lock
           '

      - name: Commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock Cargo.private-recall.lock \
            crates/public/margins-cli/Cargo.toml crates/public/margins-server/Cargo.toml \
            crates/public/margins-capture/Cargo.toml
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags
