name: Public source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public:
    if: github.repository == 'byenzyme/margins'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Free space for the disposable Cargo lane
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /tmp
      - name: Build and test all public workspace targets
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "false"
          GIT_TERMINAL_PROMPT: "0"
        run: scripts/local-gate public
