name: Release official CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing private source tag to release (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

# The default token may only read the private source repository. Publishing to
# the two public repositories uses separate, repository-scoped credentials.
permissions:
  contents: read

concurrency:
  group: official-cli-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate immutable source tag and root package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Release tag must be a complete vMAJOR.MINOR.PATCH tag"
            exit 1
          }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$VERSION" = "$PACKAGE_VERSION" || {
            echo "::error::$RELEASE_TAG does not match private root package $PACKAGE_VERSION"
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            host_arch: arm64
            # The shipped macOS binary opts into offline recall generation;
            # recall lookup alone deliberately does not link llama.cpp.
            features: audio-capture,coreml-asr,polyvoice-coreml,recall,recall-local-model
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host_arch: x86_64
            # Linux packages include portable recall lookup/indexing without
            # native local-model linkage.
            features: audio-capture,parakeet-asr,polyvoice-diarization,recall
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install Linux capture build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Build the private root distributable
        run: >-
          cargo build --release --locked --package margins --bin margins-private
          --no-default-features --features "${{ matrix.features }}"
          --target "${{ matrix.target }}"

      - name: Build the windowless meeting runtime
        if: runner.os == 'macOS'
        run: >-
          cargo build --release --locked
          --manifest-path desktop/src-tauri/Cargo.toml
          --target-dir target
          --no-default-features --features live-runtime
          --bin margins-live
          --target "${{ matrix.target }}"

      - name: Build project recording service web assets
        run: npm ci --prefix desktop && npm run --prefix desktop build

      - name: Compile the project recording service
        run: >-
          cargo build --release --locked
          --manifest-path desktop/src-tauri/Cargo.toml
          --target-dir target
          --no-default-features --features server
          --bin margins-server
          --target "${{ matrix.target }}"

      - name: Verify the meeting runtime permission metadata
        if: runner.os == 'macOS'
        run: scripts/verify-margins-live-macos.sh "target/${{ matrix.target }}/release/margins-live"

      - name: Sign and notarize the macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BINARY_PATHS: target/${{ matrix.target }}/release/margins-private target/${{ matrix.target }}/release/margins-live target/${{ matrix.target }}/release/margins-server
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/margins-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/margins-signing.keychain-db"
          NOTARIZATION_ZIP="$RUNNER_TEMP/margins-cli-notarization.zip"
          NOTARIZATION_RESULT="$RUNNER_TEMP/margins-cli-notarization.json"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH" "$KEYCHAIN_PATH" "$NOTARIZATION_ZIP" "$NOTARIZATION_RESULT"
            rm -rf "$RUNNER_TEMP/margins-cli-notarization"
          }
          trap cleanup EXIT

          for credential in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!credential:-}" ]]; then
              echo "::error::Missing required signing secret: $credential"
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -t cert \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add the temporary keychain to the user search list (preserving the
          # existing ones for the certificate chain) so codesign can resolve the
          # signing identity's private key. Without this, codesign fails with
          # "The specified item could not be found in the keychain" even though
          # find-identity locates the identity via the direct keychain path.
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F\" '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::Imported certificate does not contain a Developer ID Application identity"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "Signing with $SIGNING_IDENTITY"
          NOTARIZATION_DIR="$RUNNER_TEMP/margins-cli-notarization"
          mkdir "$NOTARIZATION_DIR"
          for BINARY_PATH in $BINARY_PATHS; do
            SIGNING_ENTITLEMENTS=()
            if [[ "$(basename "$BINARY_PATH")" == "margins-live" ]]; then
              SIGNING_ENTITLEMENTS=(--entitlements desktop/src-tauri/MarginsLive.entitlements)
            fi
            codesign \
              --force \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              "${SIGNING_ENTITLEMENTS[@]}" \
              "$BINARY_PATH"
            codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"
            if [[ "$(basename "$BINARY_PATH")" == "margins-live" ]]; then
              scripts/verify-margins-live-macos.sh "$BINARY_PATH" --signed
            fi
            cp "$BINARY_PATH" "$NOTARIZATION_DIR/"
          done

          ditto -c -k --keepParent "$NOTARIZATION_DIR" "$NOTARIZATION_ZIP"
          xcrun notarytool submit "$NOTARIZATION_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$NOTARIZATION_RESULT"
          cat "$NOTARIZATION_RESULT"

          NOTARIZATION_STATUS="$(plutil -extract status raw -o - "$NOTARIZATION_RESULT")"
          if [[ "$NOTARIZATION_STATUS" != "Accepted" ]]; then
            echo "::error::Apple notarization status was $NOTARIZATION_STATUS, expected Accepted"
            exit 1
          fi

          # Apple creates an online ticket for standalone binaries, but stapler
          # cannot attach that ticket to a bare Mach-O. The tarball below ships
          # this signed binary unchanged; Gatekeeper retrieves its ticket online.
          echo "::notice::Notarization accepted. Bare Mach-O tickets are served online and cannot be stapled."
          for BINARY_PATH in $BINARY_PATHS; do
            codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"
          done
          # spctl execute-assessment is app-bundle oriented and can reject a valid
          # bare Mach-O whose notarization ticket is served online. Keep it
          # informational so it never blocks a release; codesign --verify above and
          # notarytool "Accepted" are the authoritative gates.
          for BINARY_PATH in $BINARY_PATHS; do
            spctl --assess --type execute --verbose=4 "$BINARY_PATH" || \
              echo "::notice::spctl execute-assessment is non-authoritative for a bare Mach-O; relying on codesign --verify and notarization status"
          done

          {
            echo "### macOS CLI signing"
            echo "- Developer ID Application signature: verified"
            echo "- Hardened runtime and secure timestamp: enabled"
            echo "- Apple notarization status: Accepted"
            echo "- Stapling: unsupported for bare Mach-O; ticket is served online"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package archive and checksum
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="margins-${VERSION}-${TARGET}.tar.gz"
          mkdir packaged-cli
          install -m 0755 "target/${TARGET}/release/margins-private" packaged-cli/margins
          install -m 0755 "target/${TARGET}/release/margins-server" packaged-cli/margins-server
          if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            codesign --verify --deep --strict --verbose=2 packaged-cli/margins
            install -m 0755 "target/${TARGET}/release/margins-live" packaged-cli/margins-live
            codesign --verify --deep --strict --verbose=2 packaged-cli/margins-live
          fi
          tar -czf "$ARCHIVE" -C packaged-cli .
          if command -v shasum >/dev/null; then
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Smoke the binary from the packaged archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="margins-${VERSION}-${TARGET}.tar.gz"
          mkdir packaged-smoke
          tar -xzf "$ARCHIVE" -C packaged-smoke
          scripts/smoke-official-cli.sh packaged-smoke/margins
          if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            scripts/verify-margins-live-macos.sh packaged-smoke/margins-live --signed
            packaged-smoke/margins-live capabilities \
              | grep -Fq '"protocol_version":1'
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-cli-${{ matrix.target }}
          path: |
            margins-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            margins-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    environment: official-cli-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: official-cli-*
          merge-multiple: true
          path: dist

      - name: Verify complete artifact set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-release-artifacts.sh dist "$VERSION"

      - name: Materialize and verify public source tree
        run: |
          set -euo pipefail
          export_path="$RUNNER_TEMP/margins-public-export"
          python3 scripts/open_source_boundary.py --output "$export_path" --execute
          python3 scripts/open_source_boundary.py --verify-tree "$export_path"

      - name: Publish source tree and tag to the public repository
        env:
          GH_TOKEN: ${{ secrets.MARGINS_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          public_repo="$RUNNER_TEMP/margins-public-repository"
          export_path="$RUNNER_TEMP/margins-public-export"
          gh repo clone byenzyme/margins "$public_repo"
          rsync -a --delete --exclude '.git/' "$export_path/" "$public_repo/"
          cd "$public_repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "release: sync public source for $TAG"
            git push origin HEAD:main
          fi
          public_commit=$(git rev-parse HEAD)
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            remote_tag=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
            if [ -z "$remote_tag" ]; then
              remote_tag=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
            fi
            test "$remote_tag" = "$public_commit" || {
              echo "::error::$TAG already points to a different public source commit"
              exit 1
            }
          else
            git tag -a "$TAG" -m "Margins $TAG"
            git push origin "$TAG"
          fi

      - name: Publish release to the public open-core repository
        env:
          GH_TOKEN: ${{ secrets.MARGINS_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release create "$TAG" dist/* \
            --repo byenzyme/margins \
            --title "Margins $TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          ARM_SHA=$(cut -d ' ' -f1 "dist/margins-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          gh repo clone byenzyme/homebrew-margins "$RUNNER_TEMP/homebrew-margins" -- --depth 1
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@ARM_SHA@/${ARM_SHA}/g" \
              .github/homebrew/margins.rb.template > "$RUNNER_TEMP/margins.rb"
          mkdir -p "$RUNNER_TEMP/homebrew-margins/Formula"
          install -m 0644 "$RUNNER_TEMP/margins.rb" "$RUNNER_TEMP/homebrew-margins/Formula/margins.rb"
          cd "$RUNNER_TEMP/homebrew-margins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/margins.rb
          git diff --cached --quiet && exit 0
          git commit -m "margins ${VERSION}"
          git push origin HEAD:main
