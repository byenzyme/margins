name: Release official CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source tag to release (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

# The public repository's token publishes its own release. A separate token
# updates the Homebrew tap; official builds use a read-only Enzyme token.
# Every release secret is an environment secret on `official-cli-release`
# (deployable only from v* tags and main), so each job declares it.
permissions:
  contents: read

concurrency:
  group: official-cli-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    environment: official-cli-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate immutable source tag and root package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "byenzyme/margins"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Release tag must be a complete vMAJOR.MINOR.PATCH tag"
            exit 1
          }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$VERSION" = "$PACKAGE_VERSION" || {
            echo "::error::$RELEASE_TAG does not match private root package $PACKAGE_VERSION"
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    environment: official-cli-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            host_arch: arm64
            # The shipped macOS binary opts into offline recall generation;
            # recall lookup alone deliberately does not link llama.cpp.
            features: audio-capture,coreml-asr,polyvoice-coreml,recall,recall-local-model
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host_arch: x86_64
            # Linux packages include portable recall lookup/indexing without
            # native local-model linkage.
            features: audio-capture,parakeet-asr,polyvoice-diarization,recall
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      # Shared with cli-release-validation.yml so the dry run is the same build.
      - name: Build, sign, package and smoke
        uses: ./.github/actions/build-official-cli
        with:
          target: ${{ matrix.target }}
          host-arch: ${{ matrix.host_arch }}
          features: ${{ matrix.features }}
          version: ${{ needs.validate.outputs.version }}
          enzyme-rust-read-token: ${{ secrets.ENZYME_RUST_READ_TOKEN }}
          google-oauth-client-json: ${{ secrets.MARGINS_GOOGLE_OAUTH_CLIENT_JSON }}
          apple-certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-cli-${{ matrix.target }}
          path: |
            margins-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            margins-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    environment: official-cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: official-cli-*
          merge-multiple: true
          path: dist

      - name: Verify complete artifact set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-release-artifacts.sh dist "$VERSION"

      - name: Publish release from this tagged public source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "byenzyme/margins"
          gh release create "$TAG" dist/* \
            --repo byenzyme/margins \
            --title "Margins $TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing required secret: HOMEBREW_TAP_TOKEN"
            exit 1
          fi
          gh auth setup-git
          ARM_SHA=$(cut -d ' ' -f1 "dist/margins-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          gh repo clone byenzyme/homebrew-margins "$RUNNER_TEMP/homebrew-margins" -- --depth 1
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@ARM_SHA@/${ARM_SHA}/g" \
              .github/homebrew/margins.rb.template > "$RUNNER_TEMP/margins.rb"
          mkdir -p "$RUNNER_TEMP/homebrew-margins/Formula"
          install -m 0644 "$RUNNER_TEMP/margins.rb" "$RUNNER_TEMP/homebrew-margins/Formula/margins.rb"
          cd "$RUNNER_TEMP/homebrew-margins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/margins.rb
          git diff --cached --quiet && exit 0
          git commit -m "margins ${VERSION}"
          git push origin HEAD:main
