name: Validate official CLI packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            host_arch: arm64
            features: audio-capture,coreml-asr,polyvoice-coreml,recall,recall-local-model
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host_arch: x86_64
            features: audio-capture,parakeet-asr,polyvoice-diarization,recall
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install Linux capture build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Build the private root distributable
        run: >-
          cargo build --release --locked --package margins --bin margins-private
          --no-default-features --features "${{ matrix.features }}"
          --target "${{ matrix.target }}"

      - name: Compile the project recording service
        run: >-
          cargo build --release --locked --package margins-server
          --no-default-features --features "${{ runner.os == 'macOS' && 'coreml-asr' || 'parakeet-asr' }}"
          --bin margins-server
          --target "${{ matrix.target }}"

      - name: Package and smoke the exact archive binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          ARCHIVE="margins-${VERSION}-${TARGET}.tar.gz"
          mkdir packaged-cli
          install -m 0755 "target/${TARGET}/release/margins-private" packaged-cli/margins
          install -m 0755 "target/${TARGET}/release/margins-server" packaged-cli/margins-server
          tar -czf "$ARCHIVE" -C packaged-cli .
          if command -v shasum >/dev/null; then
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          mkdir packaged-smoke
          tar -xzf "$ARCHIVE" -C packaged-smoke
          scripts/smoke-official-cli.sh packaged-smoke/margins

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-cli-validation-${{ matrix.target }}
          path: |
            margins-*-${{ matrix.target }}.tar.gz
            margins-*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
