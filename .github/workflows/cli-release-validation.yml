name: Validate official CLI packages

# Manual, NO-PUBLISH rehearsal of cli-release.yml. It runs in the
# official-cli-release environment (dispatch from main), fetches the private
# recall engine, embeds the Google OAuth client, signs and notarizes on macOS,
# and smokes the packaged archive with the same shared action as the release.
# It never creates a release or tag and never touches the Homebrew tap.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-cli-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: official-cli-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            host_arch: arm64
            features: audio-capture,coreml-asr,polyvoice-coreml,recall,recall-local-model
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host_arch: x86_64
            features: audio-capture,parakeet-asr,polyvoice-diarization,recall
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read root package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, sign, package and smoke
        uses: ./.github/actions/build-official-cli
        with:
          target: ${{ matrix.target }}
          host-arch: ${{ matrix.host_arch }}
          features: ${{ matrix.features }}
          version: ${{ steps.version.outputs.version }}
          # Runs on main: a saved cache would hold private enzyme-rust source
          # restorable by any run, including fork pull requests. Never cache.
          cache: "false"
          enzyme-rust-read-token: ${{ secrets.ENZYME_RUST_READ_TOKEN }}
          google-oauth-client-json: ${{ secrets.MARGINS_GOOGLE_OAUTH_CLIENT_JSON }}
          apple-certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-cli-validation-${{ matrix.target }}
          path: |
            margins-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            margins-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
