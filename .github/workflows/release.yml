name: Validate open-core CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Official prebuilt binaries are released only by the private source-of-truth.
# This exported workflow has no write permission, tag trigger, release action,
# cross-repository credential, or Homebrew update capability.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Validate the portable open-core graph
        run: |
          cargo build --workspace --all-targets --no-default-features --locked
          cargo test --workspace --all-targets --no-default-features --locked

      - name: Prove this workflow cannot be mistaken for official packaging
        run: |
          echo "The open-core x86_64-unknown-linux-gnu tree is validation-only."
          echo "Official archives and sha256sum metadata come from useenzyme/margins-desktop."
