name: Windows Parakeet

on:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target/windows-parakeet
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Enable long git paths
        run: git config --global core.longpaths true

      - name: Build desktop Parakeet executable
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --no-default-features --features parakeet-asr

      - name: Smoke-launch executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "debug/margins-desktop.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Missing expected executable: $exe"
            exit 1
          }

          $process = Start-Process -FilePath $exe -ArgumentList "--help" -PassThru
          if (!$process.WaitForExit(15000)) {
            $process.Kill()
            Write-Host "Executable launched on Windows and stayed running; treating that as a runtime smoke pass."
            exit 0
          }

          Write-Host "Executable launched on Windows and exited with code $($process.ExitCode)."

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: margins-desktop-windows-parakeet-debug
          path: target/windows-parakeet/debug/margins-desktop.exe
          if-no-files-found: error
          retention-days: 14
