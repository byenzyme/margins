name: Build official Margins CLI
description: >-
  Build, sign/notarize (macOS), package and smoke one official CLI archive:
  margins, margins-server, and the pinned enzyme engine they run.
  Shared by cli-release.yml and the no-publish cli-release-validation.yml so the
  dry run exercises exactly the release build. This action never publishes.

inputs:
  target:
    description: Rust target triple
    required: true
  host-arch:
    description: Expected `uname -m` of the native runner
    required: true
  features:
    description: Official cargo feature composition for margins-private
    required: true
  version:
    description: Package version used in the archive name
    required: true
  cache:
    description: >-
      "true" to restore and save the Rust cache. Its build artifacts embed the
      Google OAuth client, so pass "true" only from a tag ref: tag-scoped caches
      are unreadable from other refs, while a cache saved on main is restorable
      by any run, including fork pull requests.
    required: true
  google-oauth-client-json:
    description: MARGINS_GOOGLE_OAUTH_CLIENT_JSON secret
    required: true
  apple-certificate-base64:
    description: APPLE_CERTIFICATE_BASE64 secret (macOS only)
    required: false
    default: ""
  apple-certificate-password:
    description: APPLE_CERTIFICATE_PASSWORD secret (macOS only)
    required: false
    default: ""
  apple-id:
    description: APPLE_ID secret (macOS only)
    required: false
    default: ""
  apple-password:
    description: APPLE_PASSWORD secret (macOS only)
    required: false
    default: ""
  apple-team-id:
    description: APPLE_TEAM_ID secret (macOS only)
    required: false
    default: ""

outputs:
  archive:
    description: File name of the packaged archive
    value: ${{ steps.package.outputs.archive }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: ${{ inputs.target }}

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        # Distinct prefix so public-ci.yml's restore keys can never match; v1
        # never restores a pre-public (v0) cache holding private engine source.
        prefix-key: v1-official

    - name: Assert native runner architecture
      shell: bash
      env:
        HOST_ARCH: ${{ inputs.host-arch }}
      run: test "$(uname -m)" = "$HOST_ARCH"

    - name: Install Linux capture build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

    - name: Build the root distributable
      shell: bash
      env:
        MARGINS_GOOGLE_OAUTH_CLIENT_JSON: ${{ inputs.google-oauth-client-json }}
        FEATURES: ${{ inputs.features }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        if [[ -z "$MARGINS_GOOGLE_OAUTH_CLIENT_JSON" ]]; then
          echo "::error::Missing required secret: MARGINS_GOOGLE_OAUTH_CLIENT_JSON"
          exit 1
        fi
        cargo build --release --locked --package margins --bin margins-private \
          --no-default-features --features "$FEATURES" \
          --target "$TARGET"

    - name: Compile the project recording service
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SERVER_FEATURES: ${{ runner.os == 'macOS' && 'coreml-asr' || 'parakeet-asr' }}
      run: >-
        cargo build --release --locked --package margins-server
        --no-default-features --features "$SERVER_FEATURES"
        --bin margins-server
        --target "$TARGET"

    # Margins ships the enzyme Enzyme users get: the official byenzyme/enzyme
    # release asset (built with --features local-llm), checked against the
    # version and per-target sha256 in scripts/enzyme-cli.pin. The pinned digest
    # must be the one GitHub recorded for release v<version> and no other
    # release's (enzyme-pin verify-release). An unpinned target fails.
    - name: Fetch the pinned enzyme engine
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        # Read-only token for the releases API (rate limit only).
        GH_TOKEN: ${{ github.token }}
      run: scripts/enzyme-pin fetch "$TARGET" "target/$TARGET/release/enzyme-pinned"

    - name: Sign and notarize the macOS CLI
      if: runner.os == 'macOS'
      shell: bash
      env:
        APPLE_CERTIFICATE_BASE64: ${{ inputs.apple-certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_PASSWORD: ${{ inputs.apple-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        VERSION: ${{ inputs.version }}
        BINARY_PATHS: target/${{ inputs.target }}/release/margins-private target/${{ inputs.target }}/release/margins-server target/${{ inputs.target }}/release/enzyme-pinned/enzyme
      run: |
        set -euo pipefail

        CERTIFICATE_PATH="$RUNNER_TEMP/margins-developer-id.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/margins-signing.keychain-db"
        NOTARIZATION_ZIP="$RUNNER_TEMP/margins-cli-notarization.zip"
        NOTARIZATION_RESULT="$RUNNER_TEMP/margins-cli-notarization.json"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

        cleanup() {
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f "$CERTIFICATE_PATH" "$KEYCHAIN_PATH" "$NOTARIZATION_ZIP" "$NOTARIZATION_RESULT"
          rm -rf "$RUNNER_TEMP/margins-cli-notarization"
        }
        trap cleanup EXIT

        for credential in \
          APPLE_CERTIFICATE_BASE64 \
          APPLE_CERTIFICATE_PASSWORD \
          APPLE_ID \
          APPLE_PASSWORD \
          APPLE_TEAM_ID
        do
          if [[ -z "${!credential:-}" ]]; then
            echo "::error::Missing required signing secret: $credential"
            exit 1
          fi
        done

        printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" \
          -k "$KEYCHAIN_PATH" \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -f pkcs12 \
          -t cert \
          -T /usr/bin/codesign \
          -T /usr/bin/security
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN_PATH"

        # Add the temporary keychain to the user search list (preserving the
        # existing ones for the certificate chain) so codesign can resolve the
        # signing identity's private key. Without this, codesign fails with
        # "The specified item could not be found in the keychain" even though
        # find-identity locates the identity via the direct keychain path.
        EXISTING_KEYCHAINS="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

        SIGNING_IDENTITY="$(
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F\" '/Developer ID Application/ { print $2; exit }'
        )"
        if [[ -z "$SIGNING_IDENTITY" ]]; then
          echo "::error::Imported certificate does not contain a Developer ID Application identity"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi

        echo "Signing with $SIGNING_IDENTITY"
        NOTARIZATION_DIR="$RUNNER_TEMP/margins-cli-notarization"
        mkdir "$NOTARIZATION_DIR"
        SIGNING_ARGS=(
          --force
          --sign "$SIGNING_IDENTITY"
          --keychain "$KEYCHAIN_PATH"
          --options runtime
          --timestamp
        )
        for BINARY_PATH in $BINARY_PATHS; do
          EXTRA_ARGS=()
          # Re-signing replaces enzyme's own signature; keep any entitlements
          # it carries (the v0.11.1 asset is linker-signed ad hoc with none).
          if [[ "$(basename "$BINARY_PATH")" == enzyme ]]; then
            EXTRA_ARGS=(--preserve-metadata=entitlements)
          fi
          codesign "${SIGNING_ARGS[@]}" ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"} "$BINARY_PATH"
          codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"
          cp "$BINARY_PATH" "$NOTARIZATION_DIR/"
        done

        ditto -c -k --keepParent "$NOTARIZATION_DIR" "$NOTARIZATION_ZIP"
        xcrun notarytool submit "$NOTARIZATION_ZIP" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait \
          --output-format json > "$NOTARIZATION_RESULT"
        test -s "$NOTARIZATION_RESULT"
        cat "$NOTARIZATION_RESULT"

        NOTARIZATION_STATUS="$(plutil -extract status raw -o - "$NOTARIZATION_RESULT")"
        if [[ "$NOTARIZATION_STATUS" != "Accepted" ]]; then
          echo "::error::Apple notarization status was $NOTARIZATION_STATUS, expected Accepted"
          exit 1
        fi

        # Apple creates an online ticket for standalone binaries, but stapler
        # cannot attach that ticket to a bare Mach-O. The tarball below ships
        # this signed binary unchanged; Gatekeeper retrieves its ticket online.
        echo "::notice::Notarization accepted. Bare Mach-O tickets are served online and cannot be stapled."
        for BINARY_PATH in $BINARY_PATHS; do
          codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"
        done
        # spctl execute-assessment is app-bundle oriented and can reject a valid
        # bare Mach-O whose notarization ticket is served online. Keep it
        # informational so it never blocks a release; codesign --verify above and
        # notarytool "Accepted" are the authoritative gates.
        for BINARY_PATH in $BINARY_PATHS; do
          spctl --assess --type execute --verbose=4 "$BINARY_PATH" || \
            echo "::notice::spctl execute-assessment is non-authoritative for a bare Mach-O; relying on codesign --verify and notarization status"
        done

        integrations/margins-menubar/package-release.sh "$VERSION" \
          "target/${{ inputs.target }}/release/margins-private" \
          "$SIGNING_IDENTITY" "$KEYCHAIN_PATH"

        {
          echo "### macOS CLI signing"
          echo "- Developer ID Application signature: verified"
          echo "- Hardened runtime and secure timestamp: enabled"
          echo "- Apple notarization status: Accepted"
          echo "- Stapling: unsupported for bare Mach-O; ticket is served online"
          echo "- Margins.app: signed, notarized, stapled, and Gatekeeper-assessed"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Package archive and checksum
      id: package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        ARCHIVE="margins-${VERSION}-${TARGET}.tar.gz"
        mkdir packaged-cli
        install -m 0755 "target/${TARGET}/release/margins-private" packaged-cli/margins
        install -m 0755 "target/${TARGET}/release/margins-server" packaged-cli/margins-server
        # Next to margins, where it looks first; installers that put margins
        # in a shared bin directory move it to ../libexec/margins/enzyme.
        install -m 0755 "target/${TARGET}/release/enzyme-pinned/enzyme" packaged-cli/enzyme
        if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
          for BINARY in margins margins-server enzyme; do
            codesign --verify --deep --strict --verbose=2 "packaged-cli/$BINARY"
          done
        fi
        tar -czf "$ARCHIVE" -C packaged-cli .
        if command -v shasum >/dev/null; then
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
        else
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
        fi
        echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

    - name: Smoke the binary from the packaged archive
      shell: bash
      env:
        ARCHIVE: ${{ steps.package.outputs.archive }}
        # Only the client embedded at build time may satisfy the release smoke.
        MARGINS_SMOKE_OAUTH_CLIENT: embedded
      run: |
        set -euo pipefail
        mkdir packaged-smoke
        tar -xzf "$ARCHIVE" -C packaged-smoke
        scripts/smoke-official-cli.sh packaged-smoke/margins
        scripts/enzyme-pin check packaged-smoke/enzyme
