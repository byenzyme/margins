[package]
name = "margins-meeting-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Transport-neutral durable state machine for the Margins meeting protocol"
repository = "https://github.com/byenzyme/margins"
readme = "README.md"
keywords = ["meeting", "protocol", "state-machine", "transcription"]
categories = ["data-structures"]

[dependencies]
blake3 = "1"
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
