[package]
name = "margins-store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable SQLite session persistence for Margins"
repository = "https://github.com/byenzyme/margins"
readme = "README.md"
keywords = ["sqlite", "persistence", "meeting", "sessions"]
categories = ["database"]

[features]
default = []

[dependencies]
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
margins-core = { version = "0.1.0", path = "../margins-core" }
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }
margins-meeting-runtime = { version = "0.1.0", path = "../margins-meeting-runtime" }
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hound = "3.5"

[dev-dependencies]
tempfile = "3"
margins-meeting-runtime = { path = "../margins-meeting-runtime", features = ["test-support"] }
