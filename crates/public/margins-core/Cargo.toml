[package]
name = "margins-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable domain types and in-process service contracts for Margins"
repository = "https://github.com/useenzyme/margins"
readme = "README.md"
keywords = ["audio", "meeting", "transcription", "contracts"]
categories = ["data-structures", "encoding"]

[features]
default = []

[dependencies]
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
