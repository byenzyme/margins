[package]
name = "margins-workflows"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable application workflows for Margins"
repository = "https://github.com/byenzyme/margins"
readme = "README.md"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Public parser for the readable workspace language (github.com/byenzyme/enzyme-spec).
enzyme-spec = { git = "https://github.com/byenzyme/enzyme-spec", tag = "v0.3.0" }
fs4 = { version = "0.13", features = ["sync"] }
globset = "0.4"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
libc = "0.2"
log = "0.4"
margins-core = { version = "0.1.0", path = "../margins-core" }
margins-media = { version = "0.1.0", path = "../margins-media" }
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }
margins-meeting-runtime = { version = "0.1.0", path = "../margins-meeting-runtime" }
margins-store = { version = "0.1.0", path = "../margins-store" }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ropus = "0.12"
rubato = { version = "0.16.2", default-features = false }
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "io-std", "io-util", "net"] }
toml = "0.8"
toml_edit = "0.22"
url = "2"
walkdir = "2"
