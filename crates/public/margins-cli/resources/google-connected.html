<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google connected · Margins</title>
  <style>
    :root {
      color-scheme: light;
      --forest: #182018;
      --paper: #f1efe8;
      --ink: #1d211c;
      --muted: #686b62;
      --line: rgba(29, 33, 28, 0.16);
      --gold: #d8a25d;
      --footer-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--ink);
      background: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .company-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(1.25rem, 3vw, 2.25rem) clamp(1.25rem, 5vw, 4.5rem);
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .wordmark svg {
      display: block;
      width: 9.4rem;
      height: auto;
      color: var(--ink);
    }
    .nav-labels,
    .footer-labels {
      display: flex;
      gap: 1.5rem;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.05em;
    }
    main {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100% - 2.5rem, 78rem);
      margin-inline: auto;
      display: grid;
      align-content: center;
      padding-block: clamp(5rem, 12vw, 10rem);
    }
    main::before,
    main::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      pointer-events: none;
    }
    main::before {
      top: 4%;
      right: -10%;
      width: min(42rem, 58vw);
      aspect-ratio: 1.35;
      background: radial-gradient(ellipse at center, rgba(24, 32, 24, 0.13), rgba(24, 32, 24, 0) 70%);
    }
    main::after {
      bottom: 2%;
      left: 18%;
      width: min(30rem, 42vw);
      aspect-ratio: 1.6;
      background: radial-gradient(ellipse at center, rgba(216, 162, 93, 0.16), rgba(216, 162, 93, 0) 72%);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1.35rem;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .eyebrow span {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--gold);
    }
    h1 {
      max-width: 11ch;
      margin: 0;
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(3.35rem, 8vw, 7.25rem);
      font-weight: 400;
      line-height: 0.91;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }
    .return {
      max-width: 38rem;
      margin: clamp(1.5rem, 4vh, 2.5rem) 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.18rem);
      line-height: 1.65;
    }
    .detail {
      max-width: 38rem;
      margin: 1.25rem 0 0;
      padding-left: 1rem;
      border-left: 2px solid var(--gold);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }
    footer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
      gap: 2rem;
      padding: clamp(3rem, 6vw, 5rem) clamp(1.25rem, 5vw, 4.5rem);
      background: var(--forest);
      color: var(--footer-ink);
    }
    footer .wordmark svg { color: var(--footer-ink); }
    footer p {
      margin: 0;
      color: rgba(255, 255, 255, 0.48);
      font-family: "Newsreader", Georgia, serif;
      font-size: 1.15rem;
      text-align: center;
    }
    .footer-labels {
      justify-content: flex-end;
      color: rgba(255, 255, 255, 0.62);
    }
    @media (max-width: 48rem) {
      .company-nav { align-items: flex-start; gap: 1rem; }
      .wordmark svg { width: 8rem; }
      .nav-labels { gap: 0.85rem; flex-wrap: wrap; justify-content: flex-end; }
      footer { grid-template-columns: 1fr; align-items: start; }
      footer p { text-align: left; }
      .footer-labels { justify-content: flex-start; flex-wrap: wrap; gap: 0.85rem; }
    }
  </style>
</head>
