[package]
name = "margins-cli"
version = "0.4.22"
edition = "2021"
license = "Apache-2.0"
description = "Standalone public command-line interface for Margins"
repository = "https://github.com/byenzyme/margins"
readme = "README.md"

[lib]
name = "margins_cli"
path = "src/lib.rs"

[[bin]]
name = "margins-public"
path = "src/main.rs"

[features]
default = []
coreml-asr = ["margins-media/coreml-asr", "margins-media/model-download"]
parakeet-onnx = ["margins-media/parakeet-onnx", "margins-media/model-download"]
polyvoice-diarization = ["margins-media/polyvoice-diarization"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
env_logger = { version = "0.11", default-features = false }
log = "0.4"
margins-core = { version = "0.1.0", path = "../margins-core" }
margins-media = { version = "0.1.0", path = "../margins-media" }
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }
margins-store = { version = "0.1.0", path = "../margins-store" }
margins-workflows = { version = "0.1.0", path = "../margins-workflows" }
ratatui = "0.30"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30" }

[dev-dependencies]
margins-meeting-protocol = { version = "0.1.0", path = "../margins-meeting-protocol" }

[build-dependencies]
chrono = "0.4"
