[package]
name = "margins-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Workspace HTTP service and BB browser capture adapter for Margins"
repository = "https://github.com/byenzyme/margins"
readme = "README.md"

[features]
default = []
parakeet-asr = ["margins-media/parakeet-onnx-dynamic"]
coreml-asr = ["margins-media/coreml-asr"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
chrono = "0.4"
dirs = "6"
margins-core = { path = "../margins-core" }
margins-media = { path = "../margins-media" }
margins-meeting-protocol = { path = "../margins-meeting-protocol" }
margins-meeting-runtime = { path = "../margins-meeting-runtime" }
margins-store = { path = "../margins-store" }
margins-workflows = { path = "../margins-workflows" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = "0.4"

[[bin]]
name = "margins-server"
path = "src/main.rs"
