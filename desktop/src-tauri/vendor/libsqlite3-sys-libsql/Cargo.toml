[package]
name = "libsqlite3-sys"
version = "0.37.0"
edition = "2021"
license = "MIT"
publish = false
description = "Compatibility shim routing SQLite's C ABI through libsql-ffi"
links = "sqlite3"

[features]
default = []
# Compatibility with sqlmodel-sqlite's dependency declaration. libSQL is
# already bundled by libsql-ffi, so enabling this must not compile another copy.
bundled = []
bundled_bindings = []

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"

[dependencies]
libsql-ffi = "=0.9.30"

[build-dependencies]
cc = "1"
